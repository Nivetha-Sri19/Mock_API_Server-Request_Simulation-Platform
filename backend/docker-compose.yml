services:
  api:
    build: .
    container_name: api-mock-platform-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: API Mock Server & Request Simulation Platform
      APP_VERSION: "1.0.0"
      ENVIRONMENT: docker
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      SECRET_KEY: change-this-to-a-random-secret-key-with-at-least-32-characters
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: api_mock_platform
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
      REDIS_CACHE_TTL: "300"
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: INFO
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: api-mock-platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: api_mock_platform
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: api-mock-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
